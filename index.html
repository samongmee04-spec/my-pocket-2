<script>
const VER='2.0.0 · 2026-11-16';
/* รายการ Daily ที่ใช้ทุกวัน */
const DI=[['Travel','ค่าเดินทาง','🚌'],['Express','Express','🛣️'],['Breakfast','Breakfast','🍳'],['Lunch','Lunch','🍱'],['Dinner','Dinner','🍜'],['Snack','Snack','🧁'],['Buying','Buying','🛍️'],['Other','Other','✨']];
const BUD0={wd:300,sat:500,sun:500};
const SAV0='เงินฝาก, กองทุน, อื่นๆ';

const sum=o=>Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);
const fmt=n=>Math.round(+n||0).toLocaleString('en-US');
const fmt2=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const p2=n=>String(n).padStart(2,'0');
const ym=d=>d.getFullYear()+'-'+p2(d.getMonth()+1);
const ymd=d=>ym(d)+'-'+p2(d.getDate());
const dt=s=>new Date(s+'T00:00');
const sh=d=>d.toLocaleDateString('th-TH',{month:'short'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* รอบเดือน: วันที่ 1 ถึงวันสิ้นเดือน (รหัสรอบ = ปี-เดือน) */
const pParts=P=>{const[y,m]=P.split('-');return[+y,+m-1]};
const pStart=P=>{const[y,m]=pParts(P);return new Date(y,m,1)};
const pEnd=P=>{const[y,m]=pParts(P);return new Date(y,m+1,0)};
const pDate=pStart;
const pOf=d=>ym(d);
const pDays=P=>{const o=[],e=pEnd(P);for(let d=pStart(P);d<=e;d.setDate(d.getDate()+1))o.push(ymd(d));return o};
const plab=P=>pStart(P).toLocaleDateString('th-TH',{month:'long',year:'numeric'});
const plb=P=>sh(pStart(P));
const addM=(P,n)=>{const[y,m]=pParts(P);return ym(new Date(y,m+n,1))};

/*PURE-START*/
const DEL='\u0000DEL';
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
function setIn(o,path,val){let c=o;for(let i=0;i<path.length-1;i++){if(!isObj(c[path[i]]))c[path[i]]={};c=c[path[i]]}c[path[path.length-1]]=val}
function delIn(o,path){let c=o;for(let i=0;i<path.length-1;i++){c=c[path[i]];if(!isObj(c))return}delete c[path[path.length-1]]}
function norm(x){const o=Object.assign({},x||{});
 for(const k of ['set','fix','yfix','debts','debt','m','d','sav','sim','plan'])if(!isObj(o[k]))o[k]={};
 if(!isObj(o.set.bud))o.set.bud={};return o}
function toFS(p,del){const o={};for(const k of Object.keys(p)){const v=p[k];o[k]=v===DEL?del():isObj(v)?toFS(v,del):v}return o}
/*PURE-END*/

/* ---------- สถานะ / ล็อกอิน / ซิงก์ ---------- */
let D=norm(),U=null,AUTH='wait',LERR='',ref=null,unsub=null,SY={s:'conn',msg:'',last:null};
let tab='ov',C={rem:1,sumi:1,sume:1,inc:0,daily:0,fix:0,debt:0},now=new Date(),cur=pDate(pOf(now)),sel=ymd(now);
const delFS=()=>firebase.firestore.FieldValue.delete();
const LK=()=>'p2_'+(U?U.uid:'x');
const keep=()=>{if(U)try{localStorage[LK()]=JSON.stringify(D)}catch(e){}};

function setErr(e){
  const c=e&&e.code;
  if(c==='unavailable'){SY.s='wait';SY.msg='ออฟไลน์อยู่ จะส่งให้เมื่อมีเน็ต'}
  else{SY.s='err';SY.msg=c==='permission-denied'?'Firestore ไม่อนุญาต — ผู้ดูแลต้องวาง Rules ตามคู่มือ':((e&&e.message)||String(e))}
  render();
}
function W(path,val){
  if(val===DEL)delIn(D,path);else setIn(D,path,val);
  keep();
  if(ref){const p={};setIn(p,path,val);ref.set(toFS(p,delFS),{merge:true}).catch(setErr)}
}
function authMsg(e){
  const c=e&&e.code;
  return ({'auth/popup-closed-by-user':'','auth/cancelled-popup-request':'',
   'auth/unauthorized-domain':'เว็บนี้ยังไม่ได้อยู่ใน Authorized domains ของ Firebase (ผู้ดูแลต้องเพิ่มโดเมน)',
   'auth/operation-not-allowed':'ยังไม่ได้เปิดวิธีล็อกอินนี้ใน Firebase Authentication',
   'auth/account-exists-with-different-credential':'อีเมลนี้เคยเข้าสู่ระบบด้วยอีกวิธีแล้ว ให้ใช้วิธีเดิม',
   'auth/network-request-failed':'ต่ออินเทอร์เน็ตไม่ได้ ลองใหม่อีกครั้ง',
   'auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง (ถ้ายังไม่เคยสมัคร ให้กด "สมัครใหม่")',
   'auth/wrong-password':'รหัสผ่านไม่ถูกต้อง','auth/user-not-found':'ยังไม่มีบัญชีนี้ กด "สมัครใหม่" ก่อน',
   'auth/email-already-in-use':'อีเมลนี้สมัครไว้แล้ว ให้กด "เข้าสู่ระบบ" แทน (ลืมรหัสกด "ลืมรหัสผ่าน")',
   'auth/weak-password':'รหัสผ่านต้องมีอย่างน้อย 6 ตัว','auth/invalid-email':'รูปแบบอีเมลไม่ถูกต้อง',
   'auth/missing-password':'กรุณาใส่รหัสผ่าน','auth/missing-email':'กรุณาใส่อีเมล',
   'auth/too-many-requests':'ลองผิดหลายครั้งเกินไป รอสักครู่แล้วลองใหม่'})[c]??('เข้าสู่ระบบไม่สำเร็จ ('+(c||e.message||e)+')');
}
function login(kind){
  LERR='';render();
  const A=firebase.auth();
  const p=kind=='g'?new firebase.auth.GoogleAuthProvider():new firebase.auth.OAuthProvider('microsoft.com');
  p.setCustomParameters({prompt:'select_account'});
  A.signInWithPopup(p).catch(e=>{
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code))return A.signInWithRedirect(p);
    LERR=authMsg(e);render();
  });
}
let EMF=0,LOK='';
function emailAuth(kind){
  const e=V('lem'),pw=(document.getElementById('lpw')||{}).value||'',A=firebase.auth();
  LERR='';LOK='';
  if(!e){LERR='กรุณาใส่อีเมล';render();return}
  if(kind=='reset'){
    A.sendPasswordResetEmail(e).then(()=>{LOK='ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่ '+e+' แล้ว (ดูในกล่องจดหมายขยะด้วย)';render()}).catch(x=>{LERR=authMsg(x);render()});
    return;
  }
  if(pw.length<6){LERR='รหัสผ่านต้องมีอย่างน้อย 6 ตัว';render();return}
  if(kind=='new'&&pw!==((document.getElementById('lpw2')||{}).value||'')){LERR='ยืนยันรหัสผ่านไม่ตรงกัน';render();return}
  (kind=='new'?A.createUserWithEmailAndPassword(e,pw):A.signInWithEmailAndPassword(e,pw)).catch(x=>{LERR=authMsg(x);render()});
}
function logout(){
  if(!confirm('ออกจากระบบ? ข้อมูลยังอยู่บนคลาวด์ เข้าสู่ระบบด้วยบัญชีเดิมเพื่อดูอีกครั้ง'))return;
  try{localStorage.removeItem(LK())}catch(e){}
  AM(0);firebase.auth().signOut();
}
function boot(){
  const cfg=window.FB_CFG;
  if(!cfg||!cfg.apiKey||/ใส่|YOUR|xxx/i.test(cfg.apiKey)){AUTH='nocfg';render();return}
  if(!window.firebase||!firebase.auth){AUTH='noload';render();return}
  try{
    firebase.initializeApp(cfg);
    const fs=firebase.firestore();
    try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
    firebase.auth().getRedirectResult().catch(e=>{LERR=authMsg(e);render()});
    firebase.auth().onAuthStateChanged(u=>{
      if(unsub){unsub();unsub=null}
      U=u;ref=null;
      if(!u){D=norm();AUTH='out';SM(0);render();return}
      AUTH='in';
      try{D=norm(JSON.parse(localStorage[LK()]||'{}'))}catch(e){D=norm()}
      ref=fs.doc('users/'+u.uid);SY.s='conn';let first=true;
      unsub=ref.onSnapshot({includeMetadataChanges:true},snap=>{
        const fc=snap.metadata.fromCache,pw=snap.metadata.hasPendingWrites;
        if(snap.exists||!fc){D=norm(snap.exists?snap.data():{});keep()}
        if(pw){SY.s='wait';SY.msg=''}
        else if(!fc){SY.s='ok';SY.last=new Date().toLocaleTimeString('th-TH')}
        else SY.s='conn';
        if(first&&!fc){first=false;if(!D.set.done)SM(1)}
        render();
      },setErr);
      render();
    });
  }catch(e){AUTH='noload';LERR=String(e.message||e);render()}
}

/* ---------- ข้อมูล / คำนวณ ---------- */
const mo=M=>{const x=D.m[M]||{};return{inc:x.inc||{},exp:x.exp||{}}};
const dayE=k=>D.d[k]||{};
const dayKeys=()=>Object.keys(D.d).filter(k=>/^\d{4}-\d\d-\d\d$/.test(k)).sort();
const daySum=M=>dayKeys().filter(k=>k.startsWith(M)).reduce((s,k)=>s+sum(dayE(k)),0);
const dKey=s=>{const w=dt(s).getDay();return w==0?'sun':w==6?'sat':'wd'};
const DKN={wd:'จันทร์–ศุกร์',sat:'วันเสาร์',sun:'วันอาทิตย์'};
const dBud=s=>{const v=D.set.bud[dKey(s)];return v===undefined?BUD0[dKey(s)]:(+v||0)};
const savN=()=>String(D.set.savN??SAV0).split(/[,，]/).map(x=>x.trim()).filter(Boolean);
const live=(x,P)=>x&&(!x.from||P>=x.from)&&(!x.del||P<x.del);
const byTs=o=>Object.entries(o||{}).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0));
/* แถว Fix ของรอบ P = รายการ Fix รายเดือน + ค่าใช้จ่ายก้อนใหญ่ประจำปีที่ครบกำหนดเดือนนี้ */
function fixRows(P){
  const mi=pParts(P)[1]+1,r=[];
  byTs(D.fix).forEach(([id,x])=>{if(live(x,P))r.push({k:'f:'+id,id,n:x.n,b:+x.b||0,y:0})});
  byTs(D.yfix).forEach(([id,x])=>{if(live(x,P)&&+x.mo===mi)r.push({k:'y:'+id,id,n:x.n,b:+x.v||0,y:1,day:+x.day||1})});
  return r;
}
const fixAct=P=>{const e=mo(P).exp;return fixRows(P).reduce((s,x)=>s+(+e[x.k]||0),0)};
const fixBud=P=>fixRows(P).reduce((s,x)=>s+x.b,0);
const dayBud=P=>pDays(P).reduce((s,k)=>s+dBud(k),0);
const expTot=M=>fixAct(M)+daySum(M);
const incTot=M=>sum(mo(M).inc);
function unpaidOf(M){
  const e=mo(M).exp,l=[];let u=0;
  fixRows(M).forEach(x=>{if(!(+e[x.k]>0)&&x.b>0){u+=x.b;l.push([x.y?'📆':'🏠',x.n,x.b])}});
  /* Daily แยก 2 ส่วน: save ได้ = งบ − ใช้จริง ของวันที่ผ่านมาแล้ว · ยังเหลือจริง = งบวันนี้ที่ยังไม่ได้ใช้ + วันถัดไปจนสิ้นเดือน */
  let sv=0,dR=0,nE=0,nEv=0;const td=ymd(new Date());
  pDays(M).forEach(s=>{const b=+dBud(s)||0,sp=sum(dayE(s)),r=b-sp;
    if(s<td){sv+=r;if(!(sp>0)){nE++;nEv+=b}}
    else if(s==td){if(r>=0)dR+=r;else sv+=r}
    else dR+=Math.max(0,r)});
  if(dR>0){u+=dR;l.push(['📅','งบรายวันที่เหลือ (วันนี้ → สิ้นเดือน)',dR])}
  return{u,l,sv,dR,nE,nEv};
}

  if(t=='sb'||t=='sg'||t=='sx'){const f={sb:'b',sg:'g',sx:'x'}[t];W(['sim',f,k],String(v).trim()===''?DEL:(+v||0));render();return}

  render();
}

function debtCalc(a,x){
  const L=Object.entries(D.debt).map(([id,e])=>Object.assign({id},e)).filter(e=>e.a==a).sort((p,q)=>(q.ts||0)-(p.ts||0));

  const lim=+x.lim||0,used=(+x.used0||0)+add-paid;return{L,paid,add,lim,used,rem:lim-used};

  add('สรุปรายเดือน',r1,[20,12,12,12,12,16,12]);
  const r2=[['เดือน','รายรับ','รายรับเพิ่มเติม','รวม']];
  P.forEach(k=>{const m=mo(k);r2.push([plab(k),n(m.inc.main),n(m.inc.extra),incTot(k)])});
  add('รายรับ',r2,[20,12,16,12]);
  const r3=[['เดือน','ประเภท','รายการ','งบ','ใช้จริง','ยังไม่จ่าย']];
  P.forEach(k=>{const e=mo(k).exp;fixRows(k).forEach(x=>{const a=n(e[x.k]);r3.push([plab(k),x.y?'ก้อนใหญ่ประจำปี':'Fix รายเดือน',x.n,x.b,a,a>0?0:x.b])})});
  add('Fix',r3,[20,16,22,10,10,12]);
  const wk=['อา','จ','อ','พ','พฤ','ศ','ส'],ds=dayKeys().filter(k=>sum(dayE(k))>0);
  const r4=[['วันที่','วัน',...DI.map(x=>x[1]),'รวม','งบวัน','เหลือ/(เกิน)']];
  ds.forEach(k=>{const e=dayE(k),t=sum(e),b=dBud(k);r4.push([k,wk[dt(k).getDay()],...DI.map(x=>n(e[x[0]])),t,b,b-t])});
  add('รายวัน',r4,[12,6,...DI.map(()=>11),10,10,12]);
  const SN=savN(),r5=[['เดือน',...SN,'รวม']];
  P.forEach(k=>{const s=D.sav[k]||{};r5.push([plab(k),...SN.map(i=>n(s[i])),sum(s)])});
  add('Saving',r5,[20,...SN.map(()=>12),12]);
  const r6=[['บัญชีหนี้','วงเงินทั้งหมด','ยอดใช้ตั้งต้น','กู้เพิ่ม','จ่ายเพิ่ม','ใช้แล้ว','เหลือใช้ได้']];
  byTs(D.debts).forEach(([a,x])=>{const c=debtCalc(a,x);r6.push([x.n,c.lim,n(x.used0),c.add,c.paid,c.used,c.rem])});
  r6.push([],['รายการเคลื่อนไหว'],['บัญชี','ประเภท','จำนวน','วันที่']);
  Object.values(D.debt||{}).sort((p,q)=>(p.ts||0)-(q.ts||0)).forEach(x=>r6.push([(D.debts[x.a]||{}).n||'(ลบแล้ว)',x.t=='pay'?'จ่ายเพิ่ม':'กู้เพิ่ม',n(x.v),x.date||'']));
  add('Debt',r6,[16,14,14,12,12,14,14]);
  const r7=[['รายการ','จำนวนเงิน','ครบกำหนด','เตือนล่วงหน้า (วัน)']];
  byTs(D.yfix).forEach(([id,x])=>{if(!x.del)r7.push([x.n,n(x.v),x.day+'/'+x.mo,n(x.rem)])});

/* ---------- แท็บ Simulate (วางแผนเงินรายวัน วันนี้ถึงสิ้นเดือน) ---------- */
const SIMX=(t,k,v,e,ph)=>`<input class="n ${e?'e':''}" type="number" inputmode="decimal" step="any" value="${v}" placeholder="${ph||0}" oninput="LI(this,'${t}','${k}')" onchange="CH(this,'${t}','${k}')">`;
const r2=v=>Math.round(v*100)/100;
const lfm=v=>v<0?'('+fmt2(-v)+')':fmt2(v);
function simRows(){
  const nd=new Date(),today=ymd(nd),P=pOf(nd),end=ymd(pEnd(P)),sm=D.sim||{},B=sm.b||{},Gt=sm.g||{},X=sm.x||{};
  const ks=[...Object.keys(B),...Object.keys(Gt),...Object.keys(X)].filter(k=>/^\d{4}-\d\d-\d\d$/.test(k)&&k<=end);
  let st=[today,...ks].reduce((a,b)=>a<b?a:b);const ps=ymd(pStart(P));if(st<ps)st=ps;
  let bal=0;const rows=[];
  for(let d=dt(st);ymd(d)<=end;d.setDate(d.getDate()+1)){
    const k=ymd(d),eb=B[k]!==undefined,eg=Gt[k]!==undefined,ex=X[k]!==undefined;
    const f1=k>=today&&!rows.length;
    const b=eb?(+B[k]||0):f1?incTot(P):bal,g=+Gt[k]||0,x=ex?(+X[k]||0):f1?Math.max(0,dBud(k)-sum(dayE(k))):dBud(k),l=r2(b+g-x);
    if(k>=today)rows.push({k,b,g,x,l,eb,eg,ex,w:d.getDay()});
    bal=l;
  }
  return{rows,P,today};
}
function sim(){
  const{rows,P,today}=simRows(),wk=['อา','จ','อ','พ','พฤ','ศ','ส'];
  const tg=rows.reduce((t,x)=>t+x.g,0),tx=rows.reduce((t,x)=>t+x.x,0),last=rows.length?rows[rows.length-1].l:0;
  const neg=rows.find(x=>x.l<0),mn=rows.reduce((m,x)=>Math.min(m,x.l),Infinity);
  let h=`<div class="nv"><b style="flex:1">🧮 Simulate · ${plab(P)}</b><button class="btn" onclick="setTab('plan')">📅 Planning</button></div>`;
  h+=card(`<div class="r"><b>เงินเหลือสิ้นเดือน (${pEnd(P).getDate()})</b><b style="color:${col(last)}">${lfm(last)} ฿</b></div>

const planP=()=>addM(pOf(new Date()),1);
function planCalc(){
  const P=planP(),pl=(D.plan||{})[P]||{},E=pl.e||{},B=pl.b||{},Gt=pl.g||{},X=pl.x||{},R=pl.r||{};
  const incDef=incTot(pOf(new Date())),inc=pl.inc!==undefined?(+pl.inc||0):incDef;
  const it=fixRows(P).map(x=>{const ed=E[x.k]!==undefined;return{n:x.n,y:x.y,k:x.k,v:ed?(+E[x.k]||0):x.b,ed}});
  const fix=it.reduce((a,x)=>a+x.v,0),after=inc-fix;
  const rt=k=>R[k]!==undefined?+R[k]||0:(D.set.bud[k]!==undefined?+D.set.bud[k]||0:BUD0[k]);
  let bal=after;const rows=[];
  pDays(P).forEach((k,i)=>{const w=dt(k).getDay(),eb=B[k]!==undefined,eg=Gt[k]!==undefined,ex=X[k]!==undefined;
    const b=eb?(+B[k]||0):i==0?after:bal,g=+Gt[k]||0,x=ex?(+X[k]||0):rt(dKey(k)),l=r2(b+g-x);
    rows.push({k,b,g,x,l,eb,eg,ex,w});bal=l});
  return{P,pl,inc,incEd:pl.inc!==undefined,incDef,it,fix,after,rt,R,rows,save:rows.length?rows[rows.length-1].l:after};
}

/* ---------- วาดหน้าจอ ---------- */
function morphKids(a,b){
  const bl=b.childNodes,m=Math.min(a.childNodes.length,bl.length);
  for(let i=0;i<m;i++)morph(a,a.childNodes[i],bl[i]);
  while(a.childNodes.length>bl.length)a.removeChild(a.lastChild);
  for(let i=a.childNodes.length;i<bl.length;i++)a.appendChild(bl[i].cloneNode(true));
}
function morph(p,a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){p.replaceChild(b.cloneNode(true),a);return}
  if(a.nodeType===3){if(a.data!==b.data)a.data=b.data;return}
  if(a.nodeType!==1)return;
  const isIn=a.nodeName==='INPUT'||a.nodeName==='TEXTAREA'||a.nodeName==='SELECT';
  if(isIn&&a.id)return;
  for(const at of Array.from(b.attributes)){if(isIn&&at.name==='value')continue;if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value)}
  for(const at of Array.from(a.attributes)){if(isIn&&at.name==='value')continue;if(!b.hasAttribute(at.name))a.removeAttribute(at.name)}
  if(isIn){if(document.activeElement!==a&&a.value!==b.value)a.value=b.value;return}
  if(a.nodeName==='DETAILS')return;
  morphKids(a,b);
}
function patch(el,html,key){
  if(el.childNodes.length&&el.dataset.k===key){const tmp=document.createElement('div');tmp.innerHTML=html;morphKids(el,tmp)}
  else el.innerHTML=html;
  el.dataset.k=key;
}

    patch(app,loginHTML(),'login');return;
  }
  top.innerHTML=`<b style="font-size:20px">รายรับ รายจ่าย</b><span class="tb"><button class="btn s y" onclick="SM(1)">🛠 ตั้งค่า</button><button class="btn s" id="xb" onclick="XL()">📊 Excel</button><button class="btn s" onclick="AM(1)">${SYT[SY.s]}</button></span>`;
  const html=tab=='ov'?ov():tab=='mo'?monthly():tab=='sim'?sim():tab=='plan'?planning():saving();
  patch(app,html,tab);
  tabs.innerHTML=[['ov','Over View'],['mo','Monthly'],['sv','Saving'],['sim','Simulate']].map(([k,l])=>`<button class="${tab==k||(k=='sim'&&tab=='plan')?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  document.getElementById('fab').style.display='';
  const sm=document.getElementById('sm');if(sm.classList.contains('show'))patch(document.getElementById('smb'),setupHTML(),'set');
  const am=document.getElementById('am');if(am.classList.contains('show'))patch(document.getElementById('amb'),accountHTML(),'acc');
}
boot();
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
